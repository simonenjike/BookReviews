<!-- Dieses Template zeigt Buchinformationen, alle Bewertungen sowie ein Formular zum Hinzufügen 
    neuer Bewertungen -->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    
    <head>
        <title th:text="${book.title}">Buchdetails</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
      
        <style>
            body { font-family: Arial; width: 80%; margin: auto; }
            table { border-collapse: collapse; width: 100%; }
            th, td { border: 1px solid #ccc; padding: 8px; }
            th { background-color: #ccffff; color: black; text-align: center; }
            h1, h2 { font-family: Bookman Old Style; text-align: center; }
            .form-section { margin-top: 30px; }
            
            /* --- Flash-Meldungen (Erfolg / Fehler) --- */
            .alert { width: 80%; margin: 20px auto; padding: 12px; border-radius: 5px;
                        font-family: Arial, sans-serif; text-align: center; font-weight: bold; 
                        box-shadow: 0 2px 5px rgba(0,0,0,0.1); animation: fadeIn 0.6s ease-in-out; }

            .alert.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

            .alert.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(-10px); }
                to     { opacity: 1; transform: translateY(0); }
}
        </style>
    </head>
    
    <body>
        <h1 th:text="${book.title}">Buchtitel</h1>

        <!-- Buchinfos in Tabellenform -->
        <table class="book-info">
            <tr>
                <th>Autor</th><td th:text="${book.author}"></td>
            </tr>
            <tr>
                <th>Genre</th><td th:text="${book.genre}"></td>
            </tr>
            <tr>
                <th>ISBN</th><td th:text="${book.isbn}"></td>
            </tr>
        </table>

        <hr/>
        
        <h2>Bewertungen</h2>
        
        <!-- Tabelle mit vorhandenen Bewertungen -->
        <table>
            <thead>
                <tr>
                    <th>Benutzer</th>
                    <th>Bewertung</th>
                    <th>Kommentar</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="rating : ${ratings}">
                    <td th:text="${rating.userName}"></td>
                    <td th:text="${rating.rating}"></td>
                    <td th:text="${rating.comment}"></td>
                </tr>
            </tbody>
        </table>
        
        <!-- Formular für neue Bewertung -->
        <div class="form-section">
            
            <!-- Flash-Meldungen -->
            <div th:if="${success}" class="alert success" th:text="${success}"></div>
            <div th:if="${error}" class="alert error" th:text="${error}"></div>
            
            <h2>Neue Bewertung hinzufügen</h2>
            <form th:action="@{'/books/' + ${book.id} + '/addRating'}" 
                     th:object="${newRating}" method="post">
                
                <label>Benutzername:</label><br>
                <input type="text" th:field="*{userName}" required/><br><br>
                
                <label>Bewertung (1–5):</label><br>
                <input type="number" th:field="*{rating}" min="1" max="5" required/><br><br>
                
                <label>Kommentar:</label><br>
                <textarea th:field="*{comment}" rows="3" cols="40"></textarea><br><br>
                
                <button type="submit">Bewertung speichern</button>
            </form>
        </div>
        
        <!-- Zurück-Button -->
        <p style="text-align:center; margin-top:30px;">
            <a th:href="@{/books}" class="back-btn">← Zurück zur Bücherliste</a>
        </p>
     
        <!-- Erfolgsmeldung -->   <!-- 
        <p th:if="${success}" th:text="${success}"
           style="color:green; text-align:center; font-weight:bold;"></p>-->

        <!-- Fehlermeldung -->   <!-- 
        <p th:if="${error}" th:text="${error}"
           style="color:red; text-align:center; font-weight:bold;"></p>-->

    </body>
    
</html>
